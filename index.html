!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wieża</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b1442}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const F='Rubik, system-ui, sans-serif';
let W,H,S,bh,baseW,ac;
function rs(){const d=window.devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,420);bh=S*0.07;baseW=S*0.55}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem('wieza')||0}catch(e){}
let st='ready',stack,cur,score,combo,cam,camT,drops,msg,msgT,shake;
function beep(f,l){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.type='triangle';v.gain.value=.12;v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+l);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}
function spawn(){const top=stack[stack.length-1];const dir=stack.length%2?1:-1;cur={x:dir>0?-top.w:W,w:top.w,dir,sp:Math.min(2.2+score*.07,6.5)*S/360}}
function reset(){stack=[{x:(W-baseW)/2,w:baseW}];score=0;combo=0;cam=0;camT=0;drops=[];msg='';msgT=0;shake=0;st='play';spawn()}
function hue(i){return(i*11+210)%360}
function place(){
  const t=stack[stack.length-1],l=Math.max(cur.x,t.x),r=Math.min(cur.x+cur.w,t.x+t.w),ov=r-l,lvl=stack.length;
  if(ov<=0){drops.push({x:cur.x,w:cur.w,y:lvl*bh,vy:0,h:hue(lvl)});st='over';shake=14;beep(110,.4);
    if(score>best){best=score;try{localStorage.setItem('wieza',best)}catch(e){}}return}
  if(Math.abs(cur.x-t.x)<S*.012){combo++;stack.push({x:t.x,w:Math.min(t.w+(combo>2?S*.02:0),baseW)});msg=combo>1?'PERFEKT x'+combo:'PERFEKT';msgT=50;beep(520+combo*60,.15);try{navigator.vibrate(15)}catch(e){}}
  else{combo=0;const cutL=cur.x<t.x;
    drops.push({x:cutL?cur.x:r,w:cur.w-ov,y:lvl*bh,vy:0,h:hue(lvl)});
    stack.push({x:l,w:ov});beep(300,.1)}
  score++;camT=Math.max(0,(stack.length-7)*bh);spawn()
}
function tap(e){e.preventDefault();if(st==='play')place();else if(st==='ready'||st==='over'){if(st==='over'&&drops.length&&drops[0].y>-9999&&shake>6)return;reset()}}
c.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{if(e.code==='Space')tap(e)});
let last=performance.now();
function draw(now){
  const k=Math.min((now-last)/16.67,3);last=now;
  if(st==='play'){cur.x+=cur.dir*cur.sp*k;if(cur.dir>0&&cur.x>W)cur.dir=-1;if(cur.dir<0&&cur.x+cur.w<0)cur.dir=1}
  cam+=(camT-cam)*.1*k;
  drops.forEach(d=>{d.vy+=.6*k*S/360;d.y-=d.vy*k});drops=drops.filter(d=>d.y>-H);
  if(shake>0)shake-=k;
  const hh=hue(score);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,`hsl(${hh},45%,22%)`);bg.addColorStop(1,`hsl(${hh+40},50%,9%)`);
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const ox=(W-S)/2*0,base=H-S*.28;
  const blk=(x,w,lv,h)=>{const y=base-lv*bh+cam-bh;if(y>H||y<-bh)return;g.fillStyle=`hsl(${h},70%,60%)`;g.fillRect(x,y,w,bh-1);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x,y,w,bh*.28)};
  stack.forEach((b,i)=>blk(b.x,b.w,i,hue(i)));
  if(st==='play')blk(cur.x,cur.w,stack.length,hue(stack.length));
  drops.forEach(d=>blk(d.x,d.w,d.y/bh,d.h));
  g.restore();
  g.textAlign='center';g.fillStyle='#fff';
  if(st!=='ready'){g.font=`800 ${S*.2}px ${F}`;g.fillText(score,W/2,H*.2+(window.innerHeight>0?0:0))}
  if(msgT>0&&st==='play'){msgT-=k;g.globalAlpha=Math.min(1,msgT/20);g.font=`800 ${S*.07}px ${F}`;g.fillStyle=`hsl(${hh+120},90%,75%)`;g.fillText(msg,W/2,H*.2+S*.12);g.globalAlpha=1}
  if(st==='ready'){g.font=`800 ${S*.2}px ${F}`;g.fillText('Wieża',W/2,H*.3);g.font=`500 ${S*.05}px ${F}`;g.fillStyle='rgba(255,255,255,.8)';g.fillText('Dotknij, gdy klocek jest nad wieżą',W/2,H*.3+S*.1);g.fillText('Trafiaj idealnie, aby powiększać klocki',W/2,H*.3+S*.17);g.fillStyle='#fff';g.font=`800 ${S*.06}px ${F}`;g.fillText('Dotknij, aby zagrać',W/2,H*.62);if(best){g.font=`500 ${S*.045}px ${F}`;g.fillText('Rekord: '+best,W/2,H*.68)}}
  if(st==='over'){g.fillStyle='rgba(10,5,30,.55)';g.fillRect(0,H*.34,W,S*.5);g.fillStyle='#fff';g.font=`800 ${S*.11}px ${F}`;g.fillText('Koniec gry',W/2,H*.34+S*.15);g.font=`500 ${S*.055}px ${F}`;g.fillText('Wynik: '+score+'   Rekord: '+best,W/2,H*.34+S*.26);g.font=`800 ${S*.05}px ${F}`;g.fillText('Dotknij, aby zagrać ponownie',W/2,H*.34+S*.40)}
  requestAnimationFrame(draw)
}
reset();st='ready';requestAnimationFrame(draw);
</script>
</body>
</html>
